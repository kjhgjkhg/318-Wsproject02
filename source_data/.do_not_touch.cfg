# Markdown笔记搜索工具配置文件
# 
# 警告：此文件位于 source_data/ 目录内
# 程序只能读取此文件，严禁修改、删除或重命名！
#
# 此文件用于存储工具的配置信息
# 用户不应手动编辑此文件

[settings]
version = 1.0.0
created_at = 2026-03-18

[paths]
# 笔记扫描目录（只读）
source_dir = ./source_data

# 报告输出目录（只写）
output_dir = ./output_build

[restrictions]
# 严禁修改源目录内的任何文件
read_only = true
# 允许读取此配置文件
config_readable = true
# 禁止写入此配置文件
config_writable = false
